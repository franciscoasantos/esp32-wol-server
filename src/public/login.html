<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>Entrar · EspNest</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('espnest:theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <style type="text/tailwindcss">
    body { @apply bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100; }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center text-center">
      <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/20">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-7 w-7"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">EspNest</h1>
      <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Entre para controlar seus dispositivos</p>
    </div>

    <div class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
      <div id="error-banner" class="mb-4 hidden items-center gap-2 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2 text-sm text-red-600 dark:text-red-300">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        <span>Usuário ou senha inválidos.</span>
      </div>

      <form method="POST" action="/auth" class="flex flex-col gap-4">
        <div>
          <label for="user" class="mb-1.5 block text-sm font-medium">Usuário</label>
          <input id="user" name="user" type="text" autocomplete="username" required autofocus
            class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-zinc-700 dark:bg-zinc-800" />
        </div>
        <div>
          <label for="pass" class="mb-1.5 block text-sm font-medium">Senha</label>
          <div class="relative">
            <input id="pass" name="pass" type="password" autocomplete="current-password" required
              class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 pr-11 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-zinc-700 dark:bg-zinc-800" />
            <button type="button" id="toggle-pass" class="absolute inset-y-0 right-0 flex items-center px-3 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200" aria-label="Mostrar senha">
              <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
          </div>
        </div>
        <button type="submit"
          class="mt-2 inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
          Entrar
        </button>
      </form>
    </div>
  </div>

  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('error-banner').classList.remove('hidden');
      document.getElementById('error-banner').classList.add('flex');
    }
    var pass = document.getElementById('pass');
    document.getElementById('toggle-pass').addEventListener('click', function () {
      pass.type = pass.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
