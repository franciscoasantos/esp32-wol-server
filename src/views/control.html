<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wake-on-LAN Control</title>
<style>
* { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
body { margin: 0; background: linear-gradient(135deg, #0f172a, #020617); color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
.container { width: 100%; max-width: 520px; }
.card { padding: 28px; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
h1 { margin: 0; font-size: 26px; }
.subtitle { opacity: 0.7; margin: 8px 0 14px; font-size: 14px; }
.field { margin-bottom: 14px; }
label { display: block; font-size: 12px; opacity: 0.8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; }
option { color: #111; }
.device-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.device-card { text-align: left; width: 100%; padding: 8px 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: white; cursor: pointer; box-shadow: none; }
.device-card:hover { background: rgba(255,255,255,.1); }
.device-card.selected { border-color: #4CAF50; background: rgba(76, 175, 80, 0.2); }
.device-card .name { font-weight: 600; font-size: 13px; line-height: 1.2; margin-bottom: 3px; }
.device-card .status-row { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; opacity: .9; }
.device-card .status-indicator { width: 7px; height: 7px; border-radius: 999px; background: #f87171; }
.device-card.is-online .status-indicator { background: #4ade80; }
.device-empty { grid-column: 1 / -1; padding: 10px; border-radius: 8px; background: rgba(255,255,255,.06); font-size: 13px; }
.status { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; }
.status.info { background: rgba(59,130,246,.15); border: 1px solid rgba(59,130,246,.3); color: #60a5fa; }
.status.success { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.3); color: #4ade80; }
.status.error { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: #f87171; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; background: linear-gradient(135deg, #4CAF50, #43a047); color: white; cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
.links { margin-top: 16px; text-align: center; display: flex; justify-content: center; gap: 14px; }
.links a { color: rgba(255,255,255,.75); text-decoration: none; font-size: 14px; }
@media (max-width: 420px) { .device-list { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>⚡ Wake-on-LAN</h1>
      <p class="subtitle">Escolha um ou vários dispositivos para enviar WoL</p>

      <div id="deviceList" class="device-list"></div>

      <div class="field">
        <label for="wolTargetSelect">Dispositivo WoL</label>
        <select id="wolTargetSelect"></select>
      </div>

      <div id="status" class="status info">
        <div class="status-dot"></div>
        <span>Aguardando ação...</span>
      </div>

      <button id="wolBtn" onclick="sendWOL()" disabled>🚀 Ligar Dispositivo(s)</button>

      <div class="links">
        <a href="/led">Controle de LED</a>
        <a href="/config">Configuração</a>
        <a href="/wol-targets">MACs WoL</a>
        <a href="/logout">Sair</a>
      </div>
    </div>
  </div>

<script>
  const eventSource = new EventSource('/api/status');
  const status = document.getElementById('status');
  const wolTargetSelect = document.getElementById('wolTargetSelect');
  const wolBtn = document.getElementById('wolBtn');
  const deviceList = document.getElementById('deviceList');

  let clients = [];
  let connectedClients = new Set();
  let selectedEspMacs = new Set();
  let wolTargets = [];

  function selectedClients() {
    return clients.filter((client) => selectedEspMacs.has(client.espMac));
  }

  function updateSelectionState() {
    const selected = selectedClients();
    if (!selected.length) {
      wolBtn.disabled = true;
      return;
    }

    const onlineCount = selected.filter((client) => connectedClients.has(client.espMac)).length;
    wolBtn.disabled = onlineCount === 0;
  }

  function renderDeviceList() {
    if (!clients.length) {
      deviceList.innerHTML = '<div class="device-empty">Nenhum cliente cadastrado.</div>';
      return;
    }

    deviceList.innerHTML = clients.map((client) => {
      const selected = selectedEspMacs.has(client.espMac) ? 'selected' : '';
      const online = connectedClients.has(client.espMac) ? 'online' : 'offline';
      return `
        <button type="button" class="device-card ${selected} ${online === 'online' ? 'is-online' : 'is-offline'}" data-esp-mac="${client.espMac}">
          <div class="name">${escapeHtml(client.nickname)}</div>
          <div class="status-row"><span class="status-indicator"></span><span>${online === 'online' ? 'Online' : 'Offline'}</span></div>
        </button>
      `;
    }).join('');
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderWolTargets() {
    if (!wolTargets.length) {
      wolTargetSelect.innerHTML = '<option value="">Nenhum MAC WoL cadastrado</option>';
      wolTargetSelect.disabled = true;
      return;
    }

    wolTargetSelect.disabled = false;
    wolTargetSelect.innerHTML = wolTargets
      .map((target) => `<option value="${target.mac}">${target.nickname} (${target.mac})</option>`)
      .join('');
  }

  async function loadClients() {
    const response = await fetch('/api/clients');
    const data = await response.json();
    clients = data.clients || [];

    const validSelected = new Set(Array.from(selectedEspMacs).filter((espMac) => clients.some((client) => client.espMac === espMac)));
    selectedEspMacs = validSelected;

    if (!selectedEspMacs.size && clients.length) {
      selectedEspMacs.add(clients[0].espMac);
    }

    renderDeviceList();
    updateSelectionState();
  }

  async function loadWolTargets() {
    const response = await fetch('/api/wol-targets');
    const data = await response.json();
    wolTargets = data.targets || [];
    renderWolTargets();
  }

  deviceList.addEventListener('click', (event) => {
    const card = event.target.closest('.device-card');
    if (!card) return;

    const espMac = card.dataset.espMac;
    if (!espMac) return;

    if (selectedEspMacs.has(espMac)) selectedEspMacs.delete(espMac);
    else selectedEspMacs.add(espMac);

    renderDeviceList();
    updateSelectionState();
  });

  eventSource.addEventListener('status', (event) => {
    const data = JSON.parse(event.data);
    connectedClients = new Set(data.connectedClients || []);
    renderDeviceList();
    updateSelectionState();
  });

  eventSource.onerror = () => {
    console.error('SSE connection error');
  };

  async function sendWOL() {
    if (!selectedEspMacs.size) return;

    wolBtn.disabled = true;
    status.className = 'status info';
    status.innerHTML = '<div class="status-dot"></div><span>Enviando comando...</span>';

    try {
      const targetMac = wolTargetSelect.value;
      if (!targetMac) {
        throw new Error('Selecione um MAC WoL cadastrado');
      }

      const payload = {
        espMacs: Array.from(selectedEspMacs),
        targetMac
      };

      const response = await fetch('/wol', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      if (response.ok && typeof data.okCount === 'number') {
        if (data.failCount === 0) {
          status.className = 'status success';
          status.innerHTML = `<div class="status-dot"></div><span>✅ Comando enviado para ${data.okCount} dispositivo(s)</span>`;
        } else {
          status.className = 'status error';
          status.innerHTML = `<div class="status-dot"></div><span>⚠️ Sucesso: ${data.okCount}, Falhas: ${data.failCount}</span>`;
        }
      } else {
        throw new Error(data.error || 'Erro desconhecido');
      }
    } catch (error) {
      status.className = 'status error';
      status.innerHTML = `<div class="status-dot"></div><span>❌ ${error.message}</span>`;
    } finally {
      updateSelectionState();
    }
  }

  loadClients();
  loadWolTargets();
</script>
</body>
</html>
