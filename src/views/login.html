<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-900 to-slate-950 p-4 text-white">
  <form class="w-full max-w-[380px] rounded-2xl border border-white/10 bg-white/5 p-7 shadow-[0_10px_40px_rgba(0,0,0,0.4)] backdrop-blur-xl max-[420px]:p-[22px]" method="POST" action="/auth">
    <h2 class="mb-5 mt-0 text-center text-2xl font-semibold">ESP Tunnel Login</h2>
    <input class="my-2 w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-[15px] text-white outline-none focus:ring-2 focus:ring-green-500" name="user" placeholder="Usuário" required>
    <input class="my-2 w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-[15px] text-white outline-none focus:ring-2 focus:ring-green-500" name="pass" type="password" placeholder="Senha" required>
    <button class="mt-3.5 w-full rounded-lg bg-green-500 px-4 py-3 text-base font-semibold text-white transition-colors hover:bg-green-600">Entrar</button>
  </form>
</body>
</html>
