<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuração de Clientes</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>option { color: #111; }</style>
</head>
<body class="m-0 flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-900 to-slate-950 p-4 text-white">
  <div class="w-full max-w-[700px]">
    <div class="rounded-2xl border border-white/10 bg-white/5 p-7 shadow-[0_10px_40px_rgba(0,0,0,0.4)] backdrop-blur-xl">
      <h1 class="mb-2 mt-0 text-[26px] font-semibold">⚙️ Configuração de Clientes</h1>
      <p class="mb-5 text-sm opacity-70">Cadastre cada ESP32 por MAC, defina apelido, quantidade de LEDs e pino da fita</p>

      <div class="mb-4 max-h-[180px] overflow-auto rounded-lg bg-white/10 p-3" id="clientsList">Carregando clientes...</div>

      <form id="clientForm">
        <div class="mb-3">
          <label class="mb-1.5 block text-[12px] uppercase tracking-[0.4px] opacity-80" for="discoveredSelect">Novo ESP32 detectado (não cadastrado)</label>
          <div class="flex items-end gap-2">
            <select id="discoveredSelect" class="flex-1 rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-white"></select>
            <button type="button" class="w-auto rounded-lg bg-white/20 px-3 py-2.5 text-sm" onclick="useDiscovered()">Usar</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 max-[760px]:grid-cols-1">
          <div class="mb-3">
            <label class="mb-1.5 block text-[12px] uppercase tracking-[0.4px] opacity-80" for="espMac">MAC do ESP32</label>
            <input id="espMac" class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-white" placeholder="Selecione um ESP detectado" required readonly />
          </div>
          <div class="mb-3">
            <label class="mb-1.5 block text-[12px] uppercase tracking-[0.4px] opacity-80" for="nickname">Apelido</label>
            <input id="nickname" class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-white" placeholder="Sala / Quarto / Oficina" required />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3 max-[760px]:grid-cols-1">
          <div class="mb-3">
            <label class="mb-1.5 block text-[12px] uppercase tracking-[0.4px] opacity-80" for="ledCount">Quantidade de LEDs</label>
            <input id="ledCount" class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-white" type="number" min="1" max="2048" value="30" required />
          </div>

          <div class="mb-3">
            <label class="mb-1.5 block text-[12px] uppercase tracking-[0.4px] opacity-80" for="ledPin">Pino do ESP32 para LED</label>
            <input id="ledPin" class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-white" type="number" min="0" max="48" value="2" required />
          </div>

          <div class="mb-3">
            <label class="mb-1.5 block text-[12px] uppercase tracking-[0.4px] opacity-80" for="ledType">Tipo de fita</label>
            <select id="ledType" class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-white" required>
              <option value="ws2812b">WS2812B (RGB)</option>
              <option value="sk6812">SK6812 (RGBW)</option>
            </select>
          </div>
        </div>

        <div id="status" class="my-4 flex items-center gap-2 rounded-lg border border-blue-400/30 bg-blue-500/15 p-3 text-sm text-blue-300">
          <div class="h-2 w-2 rounded-full bg-current"></div>
          <span>Preencha os dados e salve.</span>
        </div>

        <button class="w-full rounded-[10px] bg-gradient-to-br from-green-500 to-green-600 px-4 py-3.5 text-base font-semibold text-white" type="submit">Salvar Cliente</button>
      </form>

      <div class="mt-3.5 flex justify-center gap-3.5 text-center">
        <a class="text-sm text-white/75 hover:text-white" href="/">Wake-on-LAN</a>
        <a class="text-sm text-white/75 hover:text-white" href="/led">Controle de LED</a>
        <a class="text-sm text-white/75 hover:text-white" href="/wol-targets">MACs WoL</a>
        <a class="text-sm text-white/75 hover:text-white" href="/logout">Sair</a>
      </div>
    </div>
  </div>

<script>
  const clientsList = document.getElementById('clientsList');
  const form = document.getElementById('clientForm');
  const status = document.getElementById('status');

  const espMacInput = document.getElementById('espMac');
  const nicknameInput = document.getElementById('nickname');
  const ledCountInput = document.getElementById('ledCount');
  const ledPinInput = document.getElementById('ledPin');
  const ledTypeInput = document.getElementById('ledType');
  const discoveredSelect = document.getElementById('discoveredSelect');

  let clients = [];
  let discoveredClients = [];
  const STATUS_BASE = 'my-4 flex items-center gap-2 rounded-lg p-3 text-sm';
  const STATUS_INFO = `${STATUS_BASE} border border-blue-400/30 bg-blue-500/15 text-blue-300`;
  const STATUS_SUCCESS = `${STATUS_BASE} border border-green-400/30 bg-green-500/15 text-green-300`;
  const STATUS_ERROR = `${STATUS_BASE} border border-red-400/30 bg-red-500/15 text-red-300`;

  function setStatus(type, message) {
    if (type === 'success') status.className = STATUS_SUCCESS;
    else if (type === 'error') status.className = STATUS_ERROR;
    else status.className = STATUS_INFO;
    status.innerHTML = `<div class="h-2 w-2 rounded-full bg-current"></div><span>${message}</span>`;
  }

  function loadIntoForm(client) {
    espMacInput.value = client.espMac || '';
    nicknameInput.value = client.nickname || '';
    ledCountInput.value = client.ledCount || 30;
    ledPinInput.value = Number.isInteger(client.ledPin) ? client.ledPin : 2;
    ledTypeInput.value = client.ledType === 'sk6812' ? 'sk6812' : 'ws2812b';
  }

  function renderClientsList() {
    if (!clients.length) {
      clientsList.textContent = 'Nenhum cliente cadastrado.';
      return;
    }

    clientsList.innerHTML = clients
      .map((client) => {
        const online = client.connected ? 'online' : 'offline';
        const ledTypeLabel = client.ledType === 'sk6812' ? 'SK6812 (RGBW)' : 'WS2812B (RGB)';
        return `
          <div class="mb-1.5 flex items-center justify-between rounded-lg bg-white/5 p-2">
            <span>${client.nickname} (${client.espMac}) • LEDs ${client.ledCount} • PIN ${Number.isInteger(client.ledPin) ? client.ledPin : '-'} • ${ledTypeLabel} • ${online}</span>
            <button class="w-auto rounded-lg bg-white/20 px-2.5 py-1.5 text-[13px]" type="button" onclick="selectClient('${client.espMac}')">Editar</button>
          </div>
        `;
      })
      .join('');
  }

  function renderDiscoveredList() {
    if (!discoveredClients.length) {
      discoveredSelect.innerHTML = '<option value="">Nenhum novo ESP detectado</option>';
      discoveredSelect.disabled = true;
      return;
    }

    discoveredSelect.disabled = false;
    discoveredSelect.innerHTML = discoveredClients
      .map((item) => `<option value="${item.espMac}">${item.espMac} • ${item.ip || 'IP desconhecido'}</option>`)
      .join('');
  }

  async function loadClients() {
    const response = await fetch('/api/clients');
    const data = await response.json();
    clients = data.clients || [];
    renderClientsList();
  }

  async function loadDiscoveredClients() {
    const response = await fetch('/api/clients/discovered');
    const data = await response.json();
    discoveredClients = data.discovered || [];
    renderDiscoveredList();
  }

  window.useDiscovered = function useDiscovered() {
    const selectedMac = discoveredSelect.value;
    if (!selectedMac) return;
    espMacInput.value = selectedMac;
    setStatus('info', `ESP ${selectedMac} selecionado para cadastro`);
  };

  window.selectClient = function selectClient(espMac) {
    const client = clients.find((item) => item.espMac === espMac);
    if (!client) return;
    loadIntoForm(client);
    setStatus('info', `Editando cliente ${client.nickname}`);
  };

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const payload = {
      espMac: espMacInput.value.trim(),
      nickname: nicknameInput.value.trim(),
      ledCount: Number.parseInt(ledCountInput.value, 10),
      ledPin: Number.parseInt(ledPinInput.value, 10),
      ledType: ledTypeInput.value
    };

    setStatus('info', 'Salvando cliente...');

    try {
      const response = await fetch('/api/clients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || 'Erro ao salvar');
      }

      setStatus('success', `Cliente ${data.client.nickname} salvo com sucesso!`);
      if (espMacInput.value === payload.espMac) {
        espMacInput.value = '';
      }
      await loadClients();
      await loadDiscoveredClients();
    } catch (error) {
      setStatus('error', `❌ ${error.message}`);
    }
  });

  loadClients();
  loadDiscoveredClients();

  const eventSource = new EventSource('/api/status');
  eventSource.addEventListener('status', () => {
    loadDiscoveredClients();
  });
</script>
</body>
</html>
