<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de MAC WoL</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 text-slate-100">
  <!--APP_HEADER-->

  <main class="mx-auto w-full max-w-[700px] px-4 py-6">

    <div class="p-7">
      <h1 class="mb-2 mt-0 text-[26px] font-semibold">📝 Cadastro MAC WoL</h1>
      <p class="mb-5 text-sm opacity-70">Cadastre os MAC addresses dos dispositivos que podem receber Wake-on-LAN</p>

      <div class="mb-4 max-h-[220px] overflow-auto rounded-lg bg-white/10 p-3" id="targetsList">Carregando alvos WoL...</div>

      <form id="targetForm">
        <div class="grid grid-cols-2 gap-3 max-[760px]:grid-cols-1">
          <div class="mb-3">
            <label class="mb-1.5 block text-[12px] uppercase tracking-[0.4px] opacity-80" for="nickname">Apelido</label>
            <input id="nickname" class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-white" placeholder="PC Sala / NAS / Servidor" required />
          </div>
          <div class="mb-3">
            <label class="mb-1.5 block text-[12px] uppercase tracking-[0.4px] opacity-80" for="mac">MAC address</label>
            <input id="mac" class="w-full rounded-lg border border-white/20 bg-white/10 px-3 py-3 text-white" placeholder="AA:BB:CC:DD:EE:FF" required />
          </div>
        </div>

        <div id="status" class="my-4 flex items-center gap-2 rounded-lg border border-blue-400/30 bg-blue-500/15 p-3 text-sm text-blue-300">
          <div class="h-2 w-2 rounded-full bg-current"></div>
          <span>Preencha os dados e salve.</span>
        </div>

        <button class="w-full rounded-[10px] bg-gradient-to-br from-green-500 to-green-600 px-4 py-3.5 text-base font-semibold text-white" type="submit">Salvar MAC WoL</button>
      </form>

    </div>
  </main>

<script>
  const targetsList = document.getElementById('targetsList');
  const form = document.getElementById('targetForm');
  const status = document.getElementById('status');
  const nicknameInput = document.getElementById('nickname');
  const macInput = document.getElementById('mac');
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const topNav = document.getElementById('topNav');

  if (mobileMenuBtn && topNav) {
    mobileMenuBtn.addEventListener('click', () => {
      topNav.classList.toggle('hidden');
      const expanded = mobileMenuBtn.getAttribute('aria-expanded') === 'true';
      mobileMenuBtn.setAttribute('aria-expanded', String(!expanded));
    });
  }

  let targets = [];
  const STATUS_BASE = 'my-4 flex items-center gap-2 rounded-lg p-3 text-sm';
  const STATUS_CLASSES = getStatusClasses(STATUS_BASE);
  /* STATUS_HELPERS */

  function setStatus(type, message) {
    setStatusUI(status, STATUS_CLASSES, type, message, false);
  }

  function renderTargets() {
    if (!targets.length) {
      targetsList.textContent = 'Nenhum MAC WoL cadastrado.';
      return;
    }

    targetsList.innerHTML = targets.map((target) => `
      <div class="mb-1.5 flex items-center justify-between rounded-lg bg-white/5 p-2">
        <span>${target.nickname} (${target.mac})</span>
        <button class="w-auto rounded-lg bg-white/20 px-2.5 py-1.5 text-[13px]" type="button" onclick="editTarget('${target.mac}')">Editar</button>
      </div>
    `).join('');
  }

  async function loadTargets() {
    const response = await fetch('/api/wol-targets');
    const data = await response.json();
    targets = data.targets || [];
    renderTargets();
  }

  window.editTarget = function editTarget(mac) {
    const target = targets.find((item) => item.mac === mac);
    if (!target) return;

    nicknameInput.value = target.nickname;
    macInput.value = target.mac;
    setStatus('info', `Editando ${target.nickname}`);
  };

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const payload = {
      nickname: nicknameInput.value.trim(),
      mac: macInput.value.trim()
    };

    setStatus('info', 'Salvando MAC WoL...');

    try {
      const response = await fetch('/api/wol-targets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || 'Erro ao salvar');
      }

      setStatus('success', `MAC ${data.target.mac} salvo com sucesso!`);
      await loadTargets();
    } catch (error) {
      setStatus('error', `❌ ${error.message}`);
    }
  });

  loadTargets();
</script>
</body>
</html>
